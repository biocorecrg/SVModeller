name: Pipeline Integration Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  integration-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies and clone GAPI
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ ! -d "GAPI" ]; then
            git clone https://github.com/REPBIO-LAB/GAPI.git GAPI
          fi

      - name: Extract Compressed Toy Dataset
        run: |
          mkdir -p toy_data
          tar -xzf tests/toy_data.tar.gz -C toy_data/
          ls -la toy_data

      - name: Run Module 1 Test
        run: |
          python3 Module1.py \
            --file_path toy_data/VCF_Insertions.vcf \
            --chromosome_length toy_data/chr_length.txt
          test -f Genome_Wide_Distribution.tsv
          test -f Insertion_Features.tsv
          test -f Probabilities.tsv

      - name: Run Module 2 Test
        run: |
          python3 Module2.py \
            --consensus_path toy_data/consensus_sequences_complete.fa \
            --probabilities_numbers_path toy_data/Number_events.tsv \
            --insertion_features_path Insertion_Features.tsv \
            --genome_wide_path Genome_Wide_Distribution.tsv \
            --source_L1_path toy_data/source_loci_LINE1.tsv \
            --source_SVA_path toy_data/source_loci_SVA.tsv \
            --motifs_path toy_data/VNTR_with_start_position.txt \
            --SVA_VNTR_path toy_data/SVA_VNTR_Motifs.txt \
            --reference_fasta_path toy_data/toy_ref.fa \
            --chromosome_length_path toy_data/chr_length.txt \
            --num_events 10
          test -f Insertions_table.tsv

      - name: Run Module 3 Test
        run: |
          python3 Module3.py \
            --vcf_path toy_data/VCF_Deletions.vcf \
            --path_chromosome_length toy_data/chr_length.txt \
            --num_events 10
          test -f Deletions_table.tsv

      - name: Run Module 4 Test
        run: |
          python3 Module4.py \
            --file1 Insertions_table.tsv \
            --fasta_file toy_data/toy_ref.fa \
            --file2 Deletions_table.tsv
          test -f Modified_Reference_Genome.fasta
          test -f Sorted_Genomic_Events.tsv
