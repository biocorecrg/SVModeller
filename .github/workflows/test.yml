name: Pipeline Integration Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  integration-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Zenodo Test Datasets
        id: cache-data
        uses: actions/cache@v4
        with:
          path: test_data
          key: zenodo-test-data-v0.5-v3

      - name: Download Test Datasets from Zenodo
        if: steps.cache-data.outputs.cache-hit != 'true'
        run: |
          mkdir -p test_data
          BASE_URL="https://zenodo.org/records/18786409/files"
          TOKEN="eyJhbGciOiJIUzUxMiJ9.eyJpZCI6IjI5ODkyYWRjLTc5YjUtNDRkYS1iMGU5LTc4OTE2ZGQ0ZTIzNiIsImRhdGEiOnt9LCJyYW5kb20iOiIyOTc3YzRiM2Q0OGIzOWRlYjY3NTRhOGViNDI5YmFmMiJ9.zwH3JwxIJ-taN4QT72WxYWUIPVnIWqq5QZUj1LL8alMAaHcyizdbBtYjJ7JWTUbUDOTaoyCwplyXz1JUXp86zA"
          FILES=(
            "VCF_Insertions.vcf"
            "VCF_Deletions.vcf"
            "chr_length.txt"
            "consensus_sequences_complete.fa"
            "source_loci_LINE1.tsv"
            "source_loci_SVA.tsv"
            "VNTR_with_start_position.txt"
            "SVA_VNTR_Motifs.txt"
            "chm13v2.0.fa"
            "Number_events.tsv"
          )
          for FILE in "${FILES[@]}"; do
            echo "Downloading ${FILE}..."
            curl -f -sL "${BASE_URL}/${FILE}?download=1&token=${TOKEN}" -o "test_data/${FILE}"
            head -n 2 "test_data/${FILE}"
          done
          ls -la test_data

      - name: Run Module 1 Test
        run: |
          python3 Module1.py \
            --file_path test_data/VCF_Insertions.vcf \
            --chromosome_length test_data/chr_length.txt
          test -f Genome_Wide_Distribution.tsv
          test -f Insertion_Features.tsv
          test -f Probabilities.tsv

      - name: Run Module 2 Test
        run: |
          python3 Module2.py \
            --consensus_path test_data/consensus_sequences_complete.fa \
            --probabilities_numbers_path test_data/Number_events.tsv \
            --insertion_features_path Insertion_Features.tsv \
            --genome_wide_path Genome_Wide_Distribution.tsv \
            --source_L1_path test_data/source_loci_LINE1.tsv \
            --source_SVA_path test_data/source_loci_SVA.tsv \
            --motifs_path test_data/VNTR_with_start_position.txt \
            --SVA_VNTR_path test_data/SVA_VNTR_Motifs.txt \
            --reference_fasta_path test_data/chm13v2.0.fa \
            --chromosome_length_path test_data/chr_length.txt \
            --num_events 10
          test -f Insertions_table.tsv

      - name: Run Module 3 Test
        run: |
          python3 Module3.py \
            --vcf_path test_data/VCF_Deletions.vcf \
            --path_chromosome_length test_data/chr_length.txt \
            --num_events 10
          test -f Deletions_table.tsv

      - name: Run Module 4 Test
        run: |
          python3 Module4.py \
            --file1 Insertions_table.tsv \
            --fasta_file test_data/chm13v2.0.fa \
            --file2 Deletions_table.tsv
          test -f Modified_Reference_Genome.fasta
          test -f Sorted_Genomic_Events.tsv
