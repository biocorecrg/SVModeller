name: Zenodo Data Integration Test (Manual)

on:
  workflow_dispatch:
    inputs:
      num_events:
        description: 'Number of events to simulate'
        required: false
        default: '10'

jobs:
  zenodo-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies and clone GAPI
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ ! -d "GAPI" ]; then
            git clone https://github.com/REPBIO-LAB/GAPI.git GAPI
          fi

      - name: Download Zenodo Data
        run: |
          mkdir -p zenodo_data
          TOKEN="eyJhbGciOiJIUzUxMiJ9.eyJpZCI6IjI5ODkyYWRjLTc5YjUtNDRkYS1iMGU5LTc4OTE2ZGQ0ZTIzNiIsImRhdGEiOnt9LCJyYW5kb20iOiIyOTc3YzRiM2Q0OGIzOWRlYjY3NTRhOGViNDI5YmFmMiJ9.zwH3JwxIJ-taN4QT72WxYWUIPVnIWqq5QZUj1LL8alMAaHcyizdbBtYjJ7JWTUbUDOTaoyCwplyXz1JUXp86zA"
          RECORD_ID="18786409"
          
          echo "Fetching file list from Zenodo API..."
          curl -s "https://zenodo.org/api/records/${RECORD_ID}?token=${TOKEN}" > record.json
          
          python3 -c "
          import json, urllib.request, os
          with open('record.json') as f:
              data = json.load(f)
          token = '${TOKEN}'
          for file_info in data.get('files', []):
              key = file_info['key']
              url = file_info['links']['self'] + '?token=' + token
              print(f'Downloading {key}...')
              urllib.request.urlretrieve(url, os.path.join('zenodo_data', key))
          "
          ls -lh zenodo_data/

      - name: Run Module 1 Test (Zenodo Data)
        run: |
          python3 bin/Module1.py \
            --file_path zenodo_data/VCF_Insertions.vcf \
            --chromosome_length zenodo_data/chr_length.txt
          test -f Genome_Wide_Distribution.tsv
          test -f Insertion_Features.tsv
          test -f Probabilities.tsv

      - name: Run Module 2 Test (Zenodo Data)
        run: |
          python3 bin/Module2.py \
            --consensus_path zenodo_data/consensus_sequences_complete.fa \
            --probabilities_numbers_path zenodo_data/Number_events.tsv \
            --insertion_features_path Insertion_Features.tsv \
            --genome_wide_path Genome_Wide_Distribution.tsv \
            --source_L1_path zenodo_data/source_loci_LINE1.tsv \
            --source_SVA_path zenodo_data/source_loci_SVA.tsv \
            --motifs_path zenodo_data/VNTR_with_start_position.txt \
            --SVA_VNTR_path zenodo_data/SVA_VNTR_Motifs.txt \
            --reference_fasta_path zenodo_data/chm13v2.0.fa \
            --chromosome_length_path zenodo_data/chr_length.txt \
            --num_events ${{ github.event.inputs.num_events || 10 }}
          test -f Insertions_table.tsv

      - name: Run Module 3 Test (Zenodo Data)
        run: |
          python3 bin/Module3.py \
            --vcf_path zenodo_data/VCF_Deletions.vcf \
            --path_chromosome_length zenodo_data/chr_length.txt \
            --num_events ${{ github.event.inputs.num_events || 10 }}
          test -f Deletions_table.tsv

      - name: Run Module 4 Test (Zenodo Data)
        run: |
          python3 bin/Module4.py \
            --file1 Insertions_table.tsv \
            --fasta_file zenodo_data/chm13v2.0.fa \
            --file2 Deletions_table.tsv
          test -f Modified_Reference_Genome.fasta
          test -f Sorted_Genomic_Events.tsv
