name: Generate Command Builder

on:
  push:
    branches:
      - main
    paths:
      - 'nextflow.config'
      - 'params.yaml'
      - '.github/workflows/generate_command_builder.yml'

jobs:
  build-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate HTML Command Builder
        run: |
          docker run --rm -v "$(pwd):/workspace" \
            ghcr.io/biocorecrg/nf_command_builder:latest \
            /workspace -o /workspace/docs/command_builder.html -t "SVModeller"
          python3 -c "
          import re
          with open('docs/command_builder.html') as f:
              html = f.read()
          style_match = re.search(r'<style>.*?</style>', html, re.DOTALL)
          style_block = style_match.group(0) if style_match else ''
          body_match = re.search(r'<body>(.*?)</body>', html, re.DOTALL)
          body_content = body_match.group(1) if body_match else html.split('</style>', 1)[1]
          body_content = re.sub(r'</?body[^>]*>', '', body_content)
          body_content = re.sub(r'</html>', '', body_content)
          cleaned = '---\nlayout: default\ntitle: Command Builder\n---\n\n' + style_block + '\n\n' + body_content.strip() + '\n'
          with open('docs/command_builder.md', 'w') as f:
              f.write(cleaned)
          "
          rm docs/command_builder.html

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/command_builder.md
          git diff-index --quiet HEAD || git commit -m "Auto-generate interactive HTML command builder [skip ci]"
          git push
